name: Deploy Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions
        run: |
          supabase functions deploy get-team --project-ref $PROJECT_REF
          supabase functions deploy get-team-picks --project-ref $PROJECT_REF
          supabase functions deploy refresh-fpl-data --project-ref $PROJECT_REF
          supabase functions deploy transfer-optimizer --project-ref $PROJECT_REF
          supabase functions deploy get-live-gameweek --project-ref $PROJECT_REF
          supabase functions deploy get-team-history --project-ref $PROJECT_REF
          supabase functions deploy get-entry-leagues --project-ref $PROJECT_REF
          supabase functions deploy get-mini-league --project-ref $PROJECT_REF
          supabase functions deploy get-top-managers --project-ref $PROJECT_REF
